<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training inschrijving – Planning To Succes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #28BEC7; --teal-dark: #1a9ea6;
    --green-bg: #E1F5EE; --green-text: #0F6E56;
    --amber-bg: #FAEEDA; --amber-text: #854F0B;
    --gray-bg: #F1EFE8; --gray-text: #5F5E5A;
    --red-bg: #FCEBEB; --red-text: #A32D2D;
    --bg: #f5f5f3; --surface: #ffffff;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --text: #1a1a1a; --text-secondary: #6b6b68;
    --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }
  header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .logo-name span { color: var(--teal); }
  .admin-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); transition: background .15s; }
  .admin-btn:hover { background: var(--gray-bg); color: var(--text); }
  main { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .page-title { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 4px; }
  .page-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 2rem; }
  .date-group { margin-bottom: 1.75rem; }
  .date-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--text-secondary); margin-bottom: .6rem; padding-bottom: .5rem; border-bottom: 0.5px solid var(--border); }
  .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .slot { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: .9rem 1.1rem; cursor: pointer; transition: border-color .15s; user-select: none; }
  .slot:hover:not(.full) { border-color: var(--teal); }
  .slot.selected { border: 1.5px solid var(--teal); box-shadow: 0 0 0 3px rgba(40,190,199,.12); }
  .slot.full { opacity: .5; cursor: not-allowed; }
  .slot-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .slot-time { font-size: 15px; font-weight: 500; }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
  .badge-open { background: var(--green-bg); color: var(--green-text); }
  .badge-few { background: var(--amber-bg); color: var(--amber-text); }
  .badge-full { background: var(--gray-bg); color: var(--gray-text); }
  .spots-bar { height: 3px; background: var(--gray-bg); border-radius: 2px; overflow: hidden; }
  .spots-fill { height: 3px; border-radius: 2px; transition: width .3s; }
  .book-form { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-top: 1.5rem; }
  .book-form h3 { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
  .form-row { margin-bottom: 12px; }
  label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(40,190,199,.12); }
  .btn-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border-strong); background: transparent; color: var(--text); transition: background .12s; }
  .btn:hover { background: var(--gray-bg); }
  .btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn-primary:hover { background: var(--teal-dark); }
  .msg { font-size: 13px; margin-top: 10px; padding: 8px 12px; border-radius: var(--radius-sm); }
  .msg-ok { background: var(--green-bg); color: var(--green-text); }
  .msg-err { background: var(--red-bg); color: var(--red-text); }
  .msg-info { background: var(--gray-bg); color: var(--gray-text); }
  .admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 4rem 1rem 2rem; overflow-y: auto; }
  .admin-modal { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); width: 100%; max-width: 620px; padding: 1.5rem; }
  .modal-title { font-size: 18px; font-weight: 500; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
  .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-secondary); line-height: 1; }
  .close-btn:hover { color: var(--text); }
  .summary-bar { display: flex; gap: 1.5rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; }
  .stat { font-size: 13px; color: var(--text-secondary); }
  .stat strong { color: var(--text); font-weight: 500; }
  .admin-slot { padding: .75rem 0; border-bottom: 0.5px solid var(--border); }
  .admin-slot:last-child { border-bottom: none; }
  .admin-slot-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .booking-name { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text-secondary); padding: 3px 0; }
  .del-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
  .del-btn:hover { color: var(--red-text); }
  .empty-msg { font-size: 13px; color: var(--text-secondary); font-style: italic; }
  .login-area { max-width: 340px; }
  .login-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
  .login-row input { flex: 1; }
  .loading { text-align: center; padding: 3rem 0; color: var(--text-secondary); font-size: 14px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: -4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media(max-width:480px) { header { padding: 1rem; } main { padding: 1.25rem 1rem 3rem; } .slot-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#28BEC7" opacity=".15"/>
      <polygon points="16,5 25.5,10.5 25.5,21.5 16,27 6.5,21.5 6.5,10.5" fill="none" stroke="#28BEC7" stroke-width="1.5"/>
      <polygon points="16,10 21,13 21,19 16,22 11,19 11,13" fill="#28BEC7"/>
    </svg>
    <span class="logo-name">Planning To <span>Succes</span></span>
  </div>
  <button class="admin-btn" onclick="openAdmin()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Beheerder
  </button>
</header>

<main>
  <h1 class="page-title">Training inschrijving</h1>
  <p class="page-sub">Kies een tijdslot en schrijf je in. Maximaal 4 deelnemers per sessie.</p>
  <div id="slotsContainer"><div class="loading"><span class="spinner"></span>Boekingen ophalen…</div></div>
  <div class="book-form" id="bookForm" style="display:none">
    <h3 id="formTitle">Inschrijven</h3>
    <div class="form-row">
      <label>Jouw naam</label>
      <input type="text" id="nameInput" placeholder="Voornaam achternaam" maxlength="60" onkeydown="if(event.key==='Enter')submitBooking()" />
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitBooking()">Inschrijven</button>
      <button class="btn" onclick="cancelForm()">Annuleren</button>
    </div>
    <div id="bookMsg"></div>
  </div>
</main>

<div class="admin-overlay" id="adminOverlay" style="display:none" onclick="overlayClick(event)">
  <div class="admin-modal">
    <div id="adminLoginArea">
      <div class="modal-title">Beheerdersweergave <button class="close-btn" onclick="closeAdmin()">×</button></div>
      <div class="login-area">
        <label>Wachtwoord</label>
        <div class="login-row">
          <input type="password" id="adminPw" placeholder="••••••" onkeydown="if(event.key==='Enter')checkAdmin()" />
          <button class="btn btn-primary" onclick="checkAdmin()">Inloggen</button>
        </div>
        <div id="adminLoginMsg"></div>
      </div>
    </div>
    <div id="adminDashboard" style="display:none">
      <div class="modal-title">
        Overzicht boekingen
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn" style="font-size:13px;padding:5px 12px" onclick="refreshAdmin()">↺ Verversen</button>
          <button class="close-btn" onclick="closeAdmin()">×</button>
        </div>
      </div>
      <div class="summary-bar" id="summaryBar"></div>
      <div id="adminSlots"></div>
      <div style="margin-top:1.25rem">
        <button class="btn" onclick="logoutAdmin()">Uitloggen</button>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5Eyo4O2G6Y_UNo_6X0DivpGoTGHU7qP__b7iQW4P59vHTXG7BLQYH0CVI03w7ZgfPlg/exec";
const ADMIN_PW = "pts2025";
const MAX = 4;
const SLOTS = [
  {id:"s1",  day:"Donderdag", date:"11 juni",  time:"11:00–12:00"},
  {id:"s2",  day:"Donderdag", date:"11 juni",  time:"14:00–15:00"},
  {id:"s3",  day:"Maandag",   date:"15 juni",  time:"10:00–11:00"},
  {id:"s4",  day:"Maandag",   date:"15 juni",  time:"11:00–12:00"},
  {id:"s5",  day:"Donderdag", date:"18 juni",  time:"10:00–11:00"},
  {id:"s6",  day:"Donderdag", date:"18 juni",  time:"14:00–15:00"},
  {id:"s7",  day:"Vrijdag",   date:"19 juni",  time:"10:00–11:00"},
  {id:"s8",  day:"Maandag",   date:"22 juni",  time:"11:00–12:00"},
  {id:"s9",  day:"Dinsdag",   date:"23 juni",  time:"10:00–11:00"},
  {id:"s10", day:"Woensdag",  date:"24 juni",  time:"10:00–11:00"},
  {id:"s11", day:"Woensdag",  date:"24 juni",  time:"14:00–15:00"},
  {id:"s12", day:"Donderdag", date:"25 juni",  time:"11:00–12:00"},
  {id:"s13", day:"Vrijdag",   date:"26 juni",  time:"10:00–11:00"},
  {id:"s14", day:"Maandag",   date:"6 juli",   time:"11:00–12:00"},
  {id:"s15", day:"Woensdag",  date:"8 juli",   time:"10:00–12:00"},
  {id:"s16", day:"Donderdag", date:"9 juli",   time:"10:00–11:00"},
];

let bookings = {};
let selectedSlot = null;
let adminLoggedIn = false;

function groupByDate() {
  const g = {};
  for (const s of SLOTS) {
    const k = s.day + " " + s.date;
    if (!g[k]) g[k] = [];
    g[k].push(s);
  }
  return g;
}

function badge(count) {
  const left = MAX - count;
  if (count >= MAX) return `<span class="badge badge-full">Vol</span>`;
  if (left === 1)   return `<span class="badge badge-few">Nog 1 plek</span>`;
  return `<span class="badge badge-open">${left} plekken vrij</span>`;
}

function fillColor(count) {
  if (count >= MAX)    return "#888780";
  if (count >= MAX-1)  return "#EF9F27";
  return "#1D9E75";
}

function renderSlots() {
  const groups = groupByDate();
  let html = "";
  for (const [label, slots] of Object.entries(groups)) {
    html += `<div class="date-group"><div class="date-label">${label}</div><div class="slot-grid">`;
    for (const s of slots) {
      const count = (bookings[s.id] || []).length;
      const full = count >= MAX;
      const sel = selectedSlot === s.id ? " selected" : "";
      const fillW = Math.round((count / MAX) * 100);
      html += `<div class="slot${full?" full":""}${sel}" onclick="selectSlot('${s.id}',${full})">
        <div class="slot-top"><span class="slot-time">${s.time}</span>${badge(count)}</div>
        <div class="spots-bar"><div class="spots-fill" style="width:${fillW}%;background:${fillColor(count)}"></div></div>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById("slotsContainer").innerHTML = html;
}

async function apiRead() {
  const resp = await fetch(SCRIPT_URL + "?action=read");
  const text = await resp.text();
  try { return JSON.parse(text); } catch { return {}; }
}

async function apiWrite(data) {
  const encoded = encodeURIComponent(JSON.stringify(data));
  const resp = await fetch(`${SCRIPT_URL}?action=write&data=${encoded}`);
  const text = await resp.text();
  try { return JSON.parse(text); } catch { return {ok: false}; }
}

async function loadBookings() {
  try {
    const data = await apiRead();
    bookings = {};
    for (const s of SLOTS) bookings[s.id] = data[s.id] || [];
  } catch {
    for (const s of SLOTS) bookings[s.id] = bookings[s.id] || [];
  }
  renderSlots();
}

function selectSlot(id, full) {
  if (full) return;
  selectedSlot = id;
  renderSlots();
  const s = SLOTS.find(x => x.id === id);
  document.getElementById("formTitle").textContent = `Inschrijven: ${s.day} ${s.date}, ${s.time}`;
  const form = document.getElementById("bookForm");
  form.style.display = "block";
  form.scrollIntoView({behavior:"smooth", block:"nearest"});
  document.getElementById("nameInput").focus();
  document.getElementById("bookMsg").innerHTML = "";
  document.getElementById("nameInput").value = "";
}

function cancelForm() {
  selectedSlot = null;
  renderSlots();
  document.getElementById("bookForm").style.display = "none";
}

async function submitBooking() {
  const name = document.getElementById("nameInput").value.trim();
  const msg = document.getElementById("bookMsg");
  if (!name) { msg.innerHTML = `<div class="msg msg-err">Vul je naam in.</div>`; return; }
  if (!selectedSlot) return;

  msg.innerHTML = `<div class="msg msg-info"><span class="spinner"></span>Bezig met opslaan…</div>`;

  // Fresh read to avoid race conditions
  try {
    const fresh = await apiRead();
    for (const s of SLOTS) bookings[s.id] = fresh[s.id] || [];
  } catch {}

  const list = bookings[selectedSlot] || [];
  if (list.length >= MAX) { msg.innerHTML = `<div class="msg msg-err">Dit tijdslot is inmiddels vol.</div>`; renderSlots(); return; }
  if (list.find(n => n.toLowerCase() === name.toLowerCase())) { msg.innerHTML = `<div class="msg msg-err">Je staat al ingeschreven voor dit tijdslot.</div>`; return; }

  list.push(name);
  bookings[selectedSlot] = list;

  const result = await apiWrite(bookings);
  if (result && result.ok) {
    msg.innerHTML = `<div class="msg msg-ok">✓ Gelukt! Je bent ingeschreven voor dit tijdslot.</div>`;
    renderSlots();
    setTimeout(cancelForm, 2200);
  } else {
    list.pop();
    bookings[selectedSlot] = list;
    msg.innerHTML = `<div class="msg msg-err">Opslaan mislukt. Probeer het opnieuw.</div>`;
  }
}

// Admin
function openAdmin() {
  document.getElementById("adminOverlay").style.display = "flex";
  if (adminLoggedIn) {
    showDashboard();
  } else {
    document.getElementById("adminLoginArea").style.display = "block";
    document.getElementById("adminDashboard").style.display = "none";
    setTimeout(() => document.getElementById("adminPw").focus(), 50);
  }
}

function closeAdmin() { document.getElementById("adminOverlay").style.display = "none"; }
function overlayClick(e) { if (e.target === document.getElementById("adminOverlay")) closeAdmin(); }

function checkAdmin() {
  if (document.getElementById("adminPw").value === ADMIN_PW) {
    adminLoggedIn = true;
    showDashboard();
  } else {
    document.getElementById("adminLoginMsg").innerHTML = `<div class="msg msg-err">Onjuist wachtwoord.</div>`;
  }
}

function showDashboard() {
  document.getElementById("adminLoginArea").style.display = "none";
  document.getElementById("adminDashboard").style.display = "block";
  renderAdmin();
}

function logoutAdmin() {
  adminLoggedIn = false;
  document.getElementById("adminDashboard").style.display = "none";
  document.getElementById("adminLoginArea").style.display = "block";
  document.getElementById("adminPw").value = "";
}

async function refreshAdmin() {
  document.getElementById("adminSlots").innerHTML = `<div class="loading"><span class="spinner"></span>Verversen…</div>`;
  await loadBookings();
  renderAdmin();
}

async function deleteBooking(slotId, encodedName) {
  const name = decodeURIComponent(encodedName);
  bookings[slotId] = (bookings[slotId] || []).filter(n => n !== name);
  await apiWrite(bookings);
  renderSlots();
  renderAdmin();
}

function renderAdmin() {
  let total = 0;
  let html = "";
  for (const s of SLOTS) {
    const list = bookings[s.id] || [];
    total += list.length;
    html += `<div class="admin-slot">
      <div class="admin-slot-title">${s.day} ${s.date} · ${s.time} <span style="font-weight:400;color:var(--text-secondary)">(${list.length}/${MAX})</span></div>`;
    if (list.length === 0) {
      html += `<span class="empty-msg">Nog geen inschrijvingen</span>`;
    } else {
      for (const name of list) {
        html += `<div class="booking-name"><span>${name}</span><button class="del-btn" onclick="deleteBooking('${s.id}','${encodeURIComponent(name)}')">×</button></div>`;
      }
    }
    html += `</div>`;
  }
  document.getElementById("summaryBar").innerHTML =
    `<span class="stat">Ingeschreven: <strong>${total}</strong></span>
     <span class="stat">Sessies: <strong>${SLOTS.length}</strong></span>
     <span class="stat">Totale capaciteit: <strong>${SLOTS.length * MAX}</strong></span>`;
  document.getElementById("adminSlots").innerHTML = html;
}

// Auto-refresh every 30s
setInterval(loadBookings, 30000);
loadBookings();
</script>
</body>
</html>
